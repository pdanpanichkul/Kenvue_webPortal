<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="appHeader" class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg">
          <i data-lucide="file-up" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Global Procurement Portal</h1>
          <p class="text-xs text-slate-500">Document Submission System</p>
        </div>
      </div>

      <form th:action="@{/logout}" method="post">
        <button type="submit" class="text-xs font-semibold text-slate-600 hover:text-red-600 flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 hover:border-red-200 transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
      </form>
    </div>
  </header>
</body>
</html>
