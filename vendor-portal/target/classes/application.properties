spring.application.name=vendor-portal

# ---- Database (file-based H2, persists to ./data/vendorportal.mv.db) ----
spring.datasource.url=jdbc:h2:file:./data/vendorportal;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console for inspecting data during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- File upload storage ----
# Where uploaded PO documents are physically saved on disk
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

server.port=8080
